tunnel: asx-app
credentials-file: /etc/cloudflared/tunnel-creds.json
origincert: /etc/cloudflared/cert.pem

ingress:
  - hostname: akstest.win
    service: http://frontend:80
  - hostname: www.akstest.win
    service: http://frontend:80
  - hostname: api.akstest.win
    service: http://backend:8000
  - hostname: broker.akstest.win
    service: http://broker-frontend:80
  - hostname: broker-api.akstest.win
    service: http://broker-backend:8001
  - service: http_status:404
