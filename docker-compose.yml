version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asx-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asx}
      POSTGRES_USER: ${POSTGRES_USER:-asx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asx_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asx_user} -d ${POSTGRES_DB:-asx}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asx-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 512M
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-asx_user}:${POSTGRES_PASSWORD:-asx_password}@db:5432/${POSTGRES_DB:-asx}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:8002/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-deepseek-r1:14b}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-deepseek,nvidia,groq,local,openai}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-env}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      FRED_API_KEY: ${FRED_API_KEY:-55689724e13717f08cb5c36bf7d20921}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ACTION_INGEST_SECRET: ${TELEGRAM_ACTION_INGEST_SECRET:-}
      ADVICE_MIN_SCORE: ${ADVICE_MIN_SCORE:-65}
      ADVICE_MAX_CANDIDATES: ${ADVICE_MAX_CANDIDATES:-500}
      ADVICE_MAX_LIVE_EVAL: ${ADVICE_MAX_LIVE_EVAL:-60}
      ADVICE_UNDER_ONE_QUOTA: ${ADVICE_UNDER_ONE_QUOTA:-2}
      PAPER_MONITOR_MIN_INTERVAL_MIN: ${PAPER_MONITOR_MIN_INTERVAL_MIN:-10}
      PAPER_MONITOR_MAX_TRADES: ${PAPER_MONITOR_MAX_TRADES:-250}
      PAPER_MONITOR_STARTUP_CATCHUP: ${PAPER_MONITOR_STARTUP_CATCHUP:-true}
      PAPER_MONITOR_STARTUP_MAX_TRADES: ${PAPER_MONITOR_STARTUP_MAX_TRADES:-75}
      EODHD_API_KEY: ${EODHD_API_KEY:-}
      BROAD_SCAN_CAP: ${BROAD_SCAN_CAP:-0}
      TOPTIER_PER_TIER: ${TOPTIER_PER_TIER:-12}
      TOPTIER_MAX_AI_DEEP_DIVES: ${TOPTIER_MAX_AI_DEEP_DIVES:-0}
      ANNOUNCEMENT_NLP_MAX_SYMBOLS: ${ANNOUNCEMENT_NLP_MAX_SYMBOLS:-50}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ENV: ${ENV:-production}
      PAPER_BOOTSTRAP_MODE: ${PAPER_BOOTSTRAP_MODE:-1}
      PAPER_BOOTSTRAP_MAX_POSITIONS: ${PAPER_BOOTSTRAP_MAX_POSITIONS:-5}
      PAPER_BOOTSTRAP_AUTO_EXECUTE: ${PAPER_BOOTSTRAP_AUTO_EXECUTE:-1}
      MODEL_LOCK_IN: ${MODEL_LOCK_IN:-1}
      STARTING_CAPITAL: ${STARTING_CAPITAL:-30000}
      RISK_PER_TRADE_PCT: ${RISK_PER_TRADE_PCT:-1.5}
      MAX_SECTOR_PCT: ${MAX_SECTOR_PCT:-25}
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asx-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

  # NOTE: the local `ollama` service was removed. All local LLM inference now
  # routes through the central guardrail gateway in
  # /home/aksai/projects/local_llm_server (llama-swap + gateway.py on host
  # port 8002). A local ollama container would grab an exclusive GPU lock and
  # starve the shared gateway and other apps. asx-backend reaches the gateway
  # via LOCAL_LLM_URL (see .env).
  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    container_name: asx-cloudflared
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - my_chatbot_default
      - photos_default
      - education_default
      - home_assistant_default
      - myslack_default
      - realestate_default

networks:
  default:
  my_chatbot_default:
    external: true
  photos_default:
    external: true
  education_default:
    external: true
  home_assistant_default:
    external: true
  myslack_default:
    external: true
  realestate_default:
    external: true

volumes:
  postgres_data:
  backend_data:
