version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: asx-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asx}
      POSTGRES_USER: ${POSTGRES_USER:-asx_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asx_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asx_user} -d ${POSTGRES_DB:-asx}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asx-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-asx_user}:${POSTGRES_PASSWORD:-asx_password}@db:5432/${POSTGRES_DB:-asx}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://ollama:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-deepseek-r1:7b}
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-local,openai}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-env}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      FRED_API_KEY: ${FRED_API_KEY:-55689724e13717f08cb5c36bf7d20921}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  broker-backend:
    build:
      context: ./broker
      dockerfile: Dockerfile
    container_name: broker-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    environment:
      DATABASE_URL: postgresql://asx_user:asx_password_dev@db:5432/asx
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  broker-frontend:
    build:
      context: ./broker-frontend
      dockerfile: Dockerfile
    container_name: broker-frontend
    restart: unless-stopped
    depends_on:
      - broker-backend
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    ports:
      - "8080:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asx-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      - backend
    ports:
      - "80:80"

  ollama:
    image: ollama/ollama:latest
    container_name: asx-ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6144M
        reservations:
          memory: 2048M
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    container_name: asx-cloudflared
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  ollama_data:
